<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéTasador Minimal</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f9fafb;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #111827;
            --accent-text: #ffffff;
            --success: #10b981;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.dark-mode {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ffffff;
            --accent-text: #0f172a;
        }

        * { box-sizing: border-box; }
        body { font-family: var(--font-family); background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* NAVEGACIÓN SIDEBAR */
        nav.sidebar { width: 260px; background-color: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px 20px; transition: 0.3s; z-index: 10; }
        .logo-area { font-size: 18px; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; justify-content: space-between; }
        .menu-items { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .menu-items button { background: none; border: none; color: var(--text-muted); padding: 12px 15px; text-align: left; font-size: 15px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu-items button:hover { background-color: var(--surface); color: var(--text-main); }
        .menu-items button.activo { background-color: var(--accent); color: var(--accent-text); }
        .btn-theme { margin-top: auto; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); padding: 10px; border-radius: 8px; font-weight: 600; }

        /* ZONA PRINCIPAL */
        main { flex: 1; overflow-y: auto; padding: 50px 60px; position: relative; }
        .pantalla { display: none; max-width: 1200px; margin: auto; animation: fade 0.4s ease; }
        .pantalla.activa { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        h2 { font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 30px; letter-spacing: -0.5px; }

        /* BOTONES E INPUTS */
        .btn { background: var(--accent); color: var(--accent-text); border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface); }
        select { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); font-size: 14px; outline: none; cursor: pointer; }

        /* NUEVO: GRID PARA LOS SETS (3 por fila aprox) */
        .grid-sets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .set-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 25px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .set-card:hover { transform: translateY(-5px); border-color: var(--text-muted); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .set-card img.set-logo { max-width: 80%; height: 80px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .set-card .set-data { font-size: 14px; color: var(--text-muted); margin-top: 10px;}

        /* GALERÍA DE CARTAS Y MODO SELECCIÓN */
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .carta-wrapper { position: relative; cursor: pointer; transition: 0.2s; border-radius: 10px; }
        .carta-wrapper img { width: 100%; border-radius: 10px; display: block; border: 3px solid transparent; transition: 0.2s; }
        .carta-wrapper:hover { transform: translateY(-5px); }
        
        .no-obtenida img { filter: grayscale(100%) opacity(0.4); }
        
        /* Efecto al seleccionar en lote */
        .carta-wrapper.seleccionada img { border-color: var(--success); filter: grayscale(0%) opacity(1); transform: scale(0.95); }
        .marca-seleccion { display: none; position: absolute; top: 10px; right: 10px; background: var(--success); color: white; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 24px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 2;}
        .carta-wrapper.seleccionada .marca-seleccion { display: block; }

        /* CABECERA DEL SET (Toolbar) */
        .set-header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .set-header-info { display: flex; align-items: center; gap: 20px; }
        .set-header-info img { height: 60px; object-fit: contain; }
        
        .action-toolbar { display: flex; gap: 15px; align-items: center; background: var(--surface); padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px;}
        .lote-actions { display: none; gap: 10px; border-left: 1px solid var(--border); padding-left: 15px; }

        /* THE VAULT DASHBOARD */
        .dashboard-header { display: flex; gap: 20px; margin-bottom: 40px; }
        .metric-card { flex: 1; padding: 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
        .metric-card p { margin: 0 0 10px 0; color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
        .metric-card h3 { margin: 0; font-size: 42px; font-weight: 300; }

        /* OVERLAY / DRAWER (Igual que antes) */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        .drawer { position: fixed; top: 0; right: -450px; width: 450px; height: 100vh; background: var(--bg); border-left: 1px solid var(--border); transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1001; display: flex; flex-direction: column; }
        .drawer-header { padding: 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .drawer-header h3 { margin: 0; font-size: 24px; }
        .drawer-close { background: none; border: none; font-size: 28px; color: var(--text-muted); cursor: pointer; }
        .drawer-content { flex: 1; overflow-y: auto; padding: 30px; }
        .carta-drawer-container img { width: 220px; border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: block; margin: 0 auto 30px auto;}
        .info-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--surface); }
        .info-label { color: var(--text-muted); font-size: 14px; }
        .info-value { font-weight: 600; text-align: right;}
        .drawer-footer { padding: 30px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); }
        .drawer-footer .btn { flex: 1; padding: 15px; }

    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area"><span>⚪ PokéTasador</span></div>
        <div class="menu-items">
            <button id="btn-inicio" class="activo" onclick="cambiarPantalla('pantalla-inicio')">✦ Inicio</button>
            <button id="btn-boveda" onclick="cambiarPantalla('pantalla-boveda')">◒ The Vault</button>
            <button id="btn-wishlist" onclick="cambiarPantalla('pantalla-wishlist')">★ Wishlist</button>
            <button id="btn-colecciones" onclick="cambiarPantalla('pantalla-colecciones')">📚 Expansiones</button>
            <button id="btn-mercado" onclick="cambiarPantalla('pantalla-mercado')">⚲ Mercado</button>
        </div>
        <button class="btn-theme" onclick="toggleTema()">◐ Tema</button>
    </nav>

    <main>
        <div id="pantalla-inicio" class="pantalla activa"><h2>Panel de Control</h2><p>Selecciona una opción en el menú lateral.</p></div>
        
        <div id="pantalla-boveda" class="pantalla">
            <h2>The Vault</h2>
            <div class="dashboard-header">
                <div class="metric-card"><p>Valor Total</p><h3 id="valor-total-boveda" style="color: var(--success);">0.00 €</h3></div>
                <div class="metric-card"><p>Cartas</p><h3 id="contador-cartas">0</h3></div>
            </div>
            <div id="grid-boveda" class="grid-galeria"></div>
        </div>

        <div id="pantalla-wishlist" class="pantalla">
            <h2>Lista de Deseos</h2><div id="grid-wishlist" class="grid-galeria"></div>
        </div>

        <div id="pantalla-mercado" class="pantalla">
            <h2>Mercado</h2>
            <input type="text" id="buscador-input" placeholder="Nombre (ej. Mewtwo)" style="padding:10px; width:300px;">
            <button class="btn" onclick="buscarMercado()">Buscar</button>
            <div id="resultados-mercado" class="grid-galeria"></div>
        </div>

        <div id="pantalla-colecciones" class="pantalla">
            <h2>Catálogo de Expansiones</h2>
            <div id="lista-sets" class="grid-sets"></div>
        </div>

        <div id="pantalla-detalle-set" class="pantalla">
            <button class="btn btn-outline" style="margin-bottom: 20px; padding: 6px 12px; font-size:12px;" onclick="cambiarPantalla('pantalla-colecciones')">← Volver a Expansiones</button>
            
            <div class="set-header-container">
                <div class="set-header-info">
                    <img id="logo-set-actual" src="" alt="Logo Set">
                    <div>
                        <h2 id="titulo-set-actual" style="margin:0;">Set Name</h2>
                        <p id="datos-set-actual" style="color: var(--text-muted); margin: 5px 0 0 0;">Cargando datos...</p>
                    </div>
                </div>
            </div>

            <div class="action-toolbar">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="font-size: 14px; font-weight: 600;">Ordenar por:</span>
                    <select id="select-orden" onchange="ordenarSet()">
                        <option value="numero">Nº de Catálogo</option>
                        <option value="precioAlto">Precio: Más Alto primero</option>
                        <option value="precioBajo">Precio: Más Bajo primero</option>
                        <option value="nombre">Nombre (A-Z)</option>
                    </select>
                </div>

                <div style="flex: 1;"></div> <button id="btn-toggle-lote" class="btn btn-outline" onclick="toggleModoLote()">Modo Selección Lote</button>
                
                <div id="acciones-lote" class="lote-actions">
                    <span id="contador-lote" style="font-weight: 600; font-size: 14px;">0 sel.</span>
                    <button class="btn" style="background: var(--success);" onclick="guardarLote('vault')">+ Vault</button>
                    <button class="btn btn-outline" onclick="guardarLote('wishlist')">★ Wishlist</button>
                </div>
            </div>

            <div id="galeria-cartas" class="grid-galeria"></div>
        </div>
    </main>

    <div class="drawer-overlay" id="drawer-overlay" onclick="cerrarDrawer()"></div>
    <div class="drawer" id="side-drawer">
        <div class="drawer-header">
            <div><h3 id="drawer-nombre">Cargando...</h3><span id="drawer-set" style="color: var(--text-muted); font-size: 14px;">Set</span></div>
            <button class="drawer-close" onclick="cerrarDrawer()">×</button>
        </div>
        <div class="drawer-content">
            <div class="carta-drawer-container"><img id="drawer-img" src="" alt="Carta"></div>
            <div class="info-row"><span class="info-label">Cardmarket</span><span class="info-value" id="drawer-precio" style="color: var(--success); font-size: 18px;">0.00 €</span></div>
            <div class="info-row"><span class="info-label">Rareza</span><span class="info-value" id="drawer-rareza">-</span></div>
            <div class="info-row"><span class="info-label">ID</span><span class="info-value" id="drawer-id">-</span></div>
        </div>
        <div class="drawer-footer">
            <button class="btn" id="btn-vault" onclick="toggleVault()">Vault</button>
            <button class="btn btn-outline" id="btn-wishlist-action" onclick="toggleWishlist()">Wishlist</button>
        </div>
    </div>

    <script>
        // MEMORIA Y ESTADO
        let miVaultIds = JSON.parse(localStorage.getItem('miVault')) || [];
        let miWishlistIds = JSON.parse(localStorage.getItem('miWishlist')) || [];
        let cacheCartas = {}; 
        let cartaActiva = null; 

        // ESTADO DEL SET ACTUAL (Nuevas variables para la lógica avanzada)
        let cartasSetActual = []; // Guardamos todas las cartas descargadas para no volver a pedirlas al ordenar
        let modoSeleccionLote = false;
        let cartasSeleccionadas = new Set(); // Usamos Set (Estructura de C++) para no duplicar selecciones

        window.onload = () => { if(localStorage.getItem('tema') === 'dark') document.body.classList.add('dark-mode'); };
        function toggleTema() { document.body.classList.toggle('dark-mode'); localStorage.setItem('tema', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }

        // NAVEGACIÓN
        function cambiarPantalla(idPantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(idPantalla).classList.add('activa');
            document.querySelectorAll('.menu-items button').forEach(b => b.classList.remove('activo'));
            const btn = document.getElementById(`btn-${idPantalla.split('-')[1]}`);
            if(btn) btn.classList.add('activo');

            if(idPantalla === 'pantalla-colecciones') cargarSets();
            if(idPantalla === 'pantalla-boveda') cargarGaleriaMemoria(miVaultIds, 'grid-boveda', true);
            if(idPantalla === 'pantalla-wishlist') cargarGaleriaMemoria(miWishlistIds, 'grid-wishlist', false);
        }

        // 1. CARGAR SETS EN EL NUEVO GRID
        async function cargarSets() {
            const div = document.getElementById('lista-sets');
            if (div.innerHTML.includes("set-card")) return;
            div.innerHTML = "<p>Cargando catálogo...</p>";
            try {
                const res = await fetch('https://api.pokemontcg.io/v2/sets?orderBy=-releaseDate&pageSize=21');
                const json = await res.json();
                div.innerHTML = "";
                json.data.forEach(set => {
                    // Usamos set.images.logo para que quede espectacular en el recuadro grande
                    div.innerHTML += `
                        <div class="set-card" onclick="abrirSet('${set.id}', '${set.name}', '${set.images.logo}', '${set.releaseDate}', ${set.printedTotal})">
                            <img src="${set.images.logo}" class="set-logo" alt="${set.name}">
                            <div style="flex:1;"><strong>${set.name}</strong></div>
                            <div class="set-data">${set.releaseDate.substring(0,4)} • ${set.printedTotal} cartas</div>
                        </div>`;
                });
            } catch (error) { div.innerHTML = "Error al cargar los sets."; }
        }

        // 2. ABRIR EL DETALLE DE UN SET
        async function abrirSet(id, nombre, logoUrl, fecha, totalCartas) {
            cambiarPantalla('pantalla-detalle-set');
            
            // Reiniciar estados del lote
            modoSeleccionLote = false;
            cartasSeleccionadas.clear();
            actualizarUIModoLote();
            document.getElementById('select-orden').value = "numero"; // Resetear select

            // Actualizar Cabecera
            document.getElementById('titulo-set-actual').innerText = nombre;
            document.getElementById('logo-set-actual').src = logoUrl;
            document.getElementById('datos-set-actual').innerText = `Lanzamiento: ${fecha} | ${totalCartas} cartas en la colección`;
            
            const galeria = document.getElementById('galeria-cartas');
            galeria.innerHTML = "<p>Descargando listado de cartas...</p>";
            
            try {
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${id}&pageSize=250`);
                const json = await res.json();
                
                // Guardamos los datos puros en la memoria global para poder ordenarlos luego
                cartasSetActual = json.data; 
                json.data.forEach(c => cacheCartas[c.id] = c); // Actualizamos caché general

                pintarGaleriaSet(); // Llamamos a la función de renderizado
            } catch (error) { galeria.innerHTML = "Error al cargar."; }
        }

        // 3. MOTOR DE ORDENACIÓN
        function ordenarSet() {
            const criterio = document.getElementById('select-orden').value;
            
            // Función de ordenación nativa de JavaScript basada en condiciones
            cartasSetActual.sort((a, b) => {
                if (criterio === 'precioAlto') {
                    const precioA = a.cardmarket?.prices?.averageSellPrice || 0;
                    const precioB = b.cardmarket?.prices?.averageSellPrice || 0;
                    return precioB - precioA; // Mayor a menor
                } else if (criterio === 'precioBajo') {
                    const precioA = a.cardmarket?.prices?.averageSellPrice || 0;
                    const precioB = b.cardmarket?.prices?.averageSellPrice || 0;
                    return precioA - precioB; // Menor a mayor
                } else if (criterio === 'nombre') {
                    return a.name.localeCompare(b.name); // Alfabético
                } else {
                    // Por defecto: 'numero' de catálogo (convirtiendo a entero si se puede)
                    return parseInt(a.number) - parseInt(b.number);
                }
            });

            pintarGaleriaSet(); // Volver a dibujar la galería con el nuevo orden
        }

        // 4. PINTAR LA GALERÍA DEL SET (Usada al abrir y al ordenar)
        function pintarGaleriaSet() {
            const galeria = document.getElementById('galeria-cartas');
            galeria.innerHTML = "";

            cartasSetActual.forEach(c => {
                // Saber si ya la tengo
                const laTengoEnVault = miVaultIds.includes(c.id);
                // Si la tengo en Vault, la muestro a color. Si no, en escala de grises (no-obtenida)
                const claseBase = laTengoEnVault ? "" : "no-obtenida";
                
                // Saber si está seleccionada en el lote actual
                const claseSeleccionada = cartasSeleccionadas.has(c.id) ? "seleccionada" : "";

                galeria.innerHTML += `
                    <div id="wrapper-${c.id}" class="carta-wrapper ${claseBase} ${claseSeleccionada}" onclick="interactuarConCarta('${c.id}')">
                        <div class="marca-seleccion">✓</div>
                        <img src="${c.images.small}" alt="${c.name}">
                        <div style="font-size: 12px; margin-top:5px; text-align:center; color: var(--text-muted);">
                            ${c.cardmarket?.prices?.averageSellPrice ? c.cardmarket.prices.averageSellPrice.toFixed(2) + ' €' : '-'}
                        </div>
                    </div>`;
            });
        }

        // 5. INTERACCIÓN (Click normal vs Click en Lote)
        function interactuarConCarta(idCarta) {
            if (modoSeleccionLote) {
                // MODO LOTE: Seleccionar/Deseleccionar
                const wrapper = document.getElementById(`wrapper-${idCarta}`);
                if (cartasSeleccionadas.has(idCarta)) {
                    cartasSeleccionadas.delete(idCarta);
                    wrapper.classList.remove('seleccionada');
                } else {
                    cartasSeleccionadas.add(idCarta);
                    wrapper.classList.add('seleccionada');
                }
                document.getElementById('contador-lote').innerText = `${cartasSeleccionadas.size} sel.`;
            } else {
                // MODO NORMAL: Abrir el Drawer de detalles
                abrirDrawer(idCarta);
            }
        }

        // 6. CONTROL DEL MODO LOTE
        function toggleModoLote() {
            modoSeleccionLote = !modoSeleccionLote;
            cartasSeleccionadas.clear(); // Limpiar selecciones previas al cambiar de modo
            pintarGaleriaSet(); // Repintar para quitar las marcas de selección
            actualizarUIModoLote();
        }

        function actualizarUIModoLote() {
            const btnToggle = document.getElementById('btn-toggle-lote');
            const menuAcciones = document.getElementById('acciones-lote');
            
            if (modoSeleccionLote) {
                btnToggle.innerText = "Cancelar Selección";
                btnToggle.style.background = "var(--border)";
                menuAcciones.style.display = "flex";
                document.getElementById('contador-lote').innerText = "0 sel.";
            } else {
                btnToggle.innerText = "Modo Selección Lote";
                btnToggle.style.background = "transparent";
                menuAcciones.style.display = "none";
            }
        }

        function guardarLote(destino) {
            if (cartasSeleccionadas.size === 0) return alert("Selecciona al menos una carta.");

            // Convertir el Set(Objeto) a un Array básico
            const arraySeleccion = Array.from(cartasSeleccionadas);

            if (destino === 'vault') {
                // Concatenar lo que teníamos con lo nuevo y quitar duplicados creando un nuevo Set
                miVaultIds = [...new Set([...miVaultIds, ...arraySeleccion])];
                localStorage.setItem('miVault', JSON.stringify(miVaultIds));
            } else if (destino === 'wishlist') {
                miWishlistIds = [...new Set([...miWishlistIds, ...arraySeleccion])];
                localStorage.setItem('miWishlist', JSON.stringify(miWishlistIds));
            }

            // Salir del modo y repintar
            toggleModoLote(); 
        }

        // DRAWER Y MEMORIA GLOBAL (Se mantiene igual que la versión anterior)
        async function abrirDrawer(idCarta) {
            document.getElementById('drawer-overlay').style.opacity = '1';
            document.getElementById('drawer-overlay').style.pointerEvents = 'all';
            document.getElementById('side-drawer').style.right = '0';
            try {
                let c = cacheCartas[idCarta];
                if (!c) { const r = await fetch(`https://api.pokemontcg.io/v2/cards/${idCarta}`); const j = await r.json(); c = j.data; cacheCartas[idCarta] = c; }
                cartaActiva = c;
                document.getElementById('drawer-img').src = c.images.large;
                document.getElementById('drawer-nombre').innerText = c.name;
                document.getElementById('drawer-set').innerText = c.set.name;
                const p = c.cardmarket?.prices?.averageSellPrice;
                document.getElementById('drawer-precio').innerText = p ? p.toFixed(2) + " €" : "N/D";
                document.getElementById('drawer-rareza').innerText = c.rarity || 'Normal';
                document.getElementById('drawer-id').innerText = c.id;
                actualizarBotonesDrawer();
            } catch (e) { }
        }

        function cerrarDrawer() { document.getElementById('drawer-overlay').style.opacity = '0'; document.getElementById('drawer-overlay').style.pointerEvents = 'none'; document.getElementById('side-drawer').style.right = '-450px'; }
        
        function actualizarBotonesDrawer() {
            const bv = document.getElementById('btn-vault'); const bw = document.getElementById('btn-wishlist-action');
            if (miVaultIds.includes(cartaActiva.id)) { bv.innerText = "Quitar de Vault"; bv.style.background = "var(--surface)"; bv.style.color = "var(--text-main)"; }
            else { bv.innerText = "Añadir a Vault"; bv.style.background = "var(--accent)"; bv.style.color = "var(--accent-text)"; }
            if (miWishlistIds.includes(cartaActiva.id)) { bw.innerText = "★ Quitar Wishlist"; bw.style.background = "#fff9c4"; bw.style.color = "#f57f17"; }
            else { bw.innerText = "☆ Wishlist"; bw.style.background = "transparent"; bw.style.color = "var(--text-main)"; }
        }

        function toggleVault() {
            const id = cartaActiva.id;
            if (miVaultIds.includes(id)) miVaultIds = miVaultIds.filter(x => x !== id); else miVaultIds.push(id);
            localStorage.setItem('miVault', JSON.stringify(miVaultIds));
            actualizarBotonesDrawer(); pintarGaleriaSet(); // Repintar el set por si estamos viéndolo
        }

        function toggleWishlist() {
            const id = cartaActiva.id;
            if (miWishlistIds.includes(id)) miWishlistIds = miWishlistIds.filter(x => x !== id); else miWishlistIds.push(id);
            localStorage.setItem('miWishlist', JSON.stringify(miWishlistIds));
            actualizarBotonesDrawer();
        }

        async function cargarGaleriaMemoria(listaIds, contenedorId, esVault) {
            const grid = document.getElementById(contenedorId);
            if (listaIds.length === 0) {
                grid.innerHTML = "<p>Vacío.</p>";
                if(esVault){ document.getElementById('valor-total-boveda').innerText = "0.00 €"; document.getElementById('contador-cartas').innerText = "0"; }
                return;
            }
            grid.innerHTML = "<p>Cargando...</p>";
            try {
                const query = listaIds.map(id => `id:${id}`).join(' OR ');
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=${query}`);
                const datos = await res.json();
                let suma = 0; grid.innerHTML = "";
                datos.data.forEach(c => { cacheCartas[c.id] = c; suma += c.cardmarket?.prices?.averageSellPrice || 0; grid.innerHTML += `<div class="carta-wrapper"><img src="${c.images.small}" onclick="abrirDrawer('${c.id}')"></div>`; });
                if(esVault){ document.getElementById('valor-total-boveda').innerText = suma.toFixed(2) + " €"; document.getElementById('contador-cartas').innerText = datos.data.length; }
            } catch (e) { grid.innerHTML = "Error."; }
        }

        async function buscarMercado() {
            const t = document.getElementById('buscador-input').value; const r = document.getElementById('resultados-mercado');
            if(t==="") return; r.innerHTML = "Buscando...";
            const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=name:${t}`); const json = await res.json();
            r.innerHTML = ""; json.data.forEach(c => { cacheCartas[c.id] = c; r.innerHTML += `<div class="carta-wrapper"><img src="${c.images.small}" onclick="abrirDrawer('${c.id}')"></div>`; });
        }
    </script>
</body>
</html>
